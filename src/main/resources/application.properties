# HTTP port configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS wide open for the frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=*
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-max-age=24H

# Base URL of the AI agent. Comes from the AI_AGENT_URL env var
# (secret/configmap configured on the platform); POSTs go to {AI_AGENT_URL}/analyze
ai.agent.url=${AI_AGENT_URL:}

# Avoid the interactive analytics consent prompt blocking dev-mode startup
quarkus.analytics.disabled=true
